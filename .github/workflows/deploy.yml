name: Website CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: rotary-website-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Direct Upload Pages project. It cannot be converted to a Git-connected
  # one (that is set at creation), which is why deploys run from here
  # rather than from Cloudflare's own GitHub integration.
  PAGES_PROJECT: rotaryconnect

jobs:
  build:
    name: 🏗️ Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: |
          echo "🏗️ Building production bundle..."
          npm run build
          echo "✅ Build successful"
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://rotaryapi.digiflecttech.dev' }}

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ Build output missing!"
            exit 1
          fi
          # Same guard the dashboard workflow carries: a build pointed at
          # localhost silently breaks the join form, and the failure only
          # shows up in a visitor's browser console.
          if ! grep -rq "rotaryapi.digiflecttech.dev" dist/assets/; then
            echo "❌ Production API URL missing from build — refusing to deploy"
            exit 1
          fi
          if grep -rq "localhost:8000" dist/assets/; then
            echo "❌ Build points at localhost — refusing to deploy"
            exit 1
          fi
          # React Router owns /request-to-join; without this rewrite Pages
          # 404s on a direct load of it.
          if [ ! -f dist/_redirects ]; then
            echo "❌ _redirects missing — SPA routes would 404"
            exit 1
          fi
          echo "✅ Build verified against production API"
          du -sh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          retention-days: 7

  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Verify the live site
        run: |
          # Pages serves the new deployment within seconds, but give the
          # edge a moment before asserting on it.
          sleep 20
          for path in / /request-to-join; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://rotaryconnect.digiflecttech.dev$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "❌ Live site returned $code for $path"
              exit 1
            fi
          done
          echo "✅ Rotary Connect website deployed"
