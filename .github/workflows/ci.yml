name: Website CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: rotary-website-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: 🏗️ Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: |
          echo "🏗️ Building production bundle..."
          npm run build
          echo "✅ Build successful"
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://rotaryapi.digiflecttech.dev' }}

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ Build output missing!"
            exit 1
          fi
          # Same guard the dashboard workflow carries: a build pointed at
          # localhost silently breaks the join form, and the failure only
          # shows up in a visitor's browser console.
          if ! grep -rq "rotaryapi.digiflecttech.dev" dist/assets/; then
            echo "❌ Production API URL missing from build"
            exit 1
          fi
          if grep -rq "localhost:8000" dist/assets/; then
            echo "❌ Build points at localhost"
            exit 1
          fi
          # React Router owns /request-to-join; without this rewrite Pages
          # 404s on a direct load of it.
          if [ ! -f dist/_redirects ]; then
            echo "❌ _redirects missing — SPA routes would 404"
            exit 1
          fi
          echo "✅ Build verified against production API"
          du -sh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          retention-days: 7

# Deployment is not done here. Cloudflare Pages builds this repo itself on
# every push to main via its GitHub integration, so no API token is stored
# in this repository at all. This workflow only guards the build: it runs
# on pull requests too, where Cloudflare's own build would not gate a
# merge.
